<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step By Step Game</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#6366f1',
            secondary: '#8b5cf6',
            accent: '#f59e0b',
            dark: '#1f2937',
            darker: '#111827'
          }
        }
      }
    }
  </script>
  <style>
    @keyframes spin-slow { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.5); } 50% { box-shadow: 0 0 40px rgba(99, 102, 241, 0.8); } }
    .roulette-container { mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent); }
    .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
    .dark .glass { background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); }
    .loading-dots:after { content: '...'; animation: dots 1.5s steps(5, end) infinite; }
    @keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60% { content: '...'; } 80%, 100% { content: ''; } }
    .line-through { text-decoration: line-through; opacity: 0.5; }
    .fullscreen-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; overflow-y: auto; }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 dark:from-gray-900 dark:via-purple-900 dark:to-indigo-900 min-h-screen text-white overflow-x-hidden">
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    
    const TelegramWebApp = window.Telegram?.WebApp;
    const ADMIN_WALLET = 'UQAWqaIPFSg81l9MlgAx0HBE9o3gpJMhk1dnyryKJXhWNHIc';
    const TONCENTER_API = 'https://toncenter.com/api/v2';
    
    // Награды для каждого кейса
    const CASE_REWARDS = {
      diamond: [
        { id: 'stars_2', name: '2 ⭐️', displayChance: '95%', realChance: 95, type: 'stars', value: 2, emoji: '⭐' },
        { id: 'bear', name: 'Мишка 🧸', displayChance: '3.7%', realChance: 3.7, type: 'item', sellPrice: 30, emoji: '🧸' },
        { id: 'snoop', name: 'Снуп Дог 🐕', displayChance: '1.25%', realChance: 1.25, type: 'item', sellPrice: 125, emoji: '🐕' },
        { id: 'diamond_special', name: 'Алмаз 💎', displayChance: '0.05%', realChance: 0, type: 'collectible', emoji: '💎' }
      ],
      coal: [
        { id: 'stars_015', name: '0.15 ⭐️', displayChance: '90%', realChance: 90, type: 'stars', value: 0.15, emoji: '⭐' },
        { id: 'pickaxe', name: 'Кирка ⛏️', displayChance: '6%', realChance: 6, type: 'item', sellPrice: 2.5, emoji: '⛏️' },
        { id: 'material', name: 'Материал 🧱', displayChance: '3%', realChance: 3, type: 'item', sellPrice: 4, emoji: '🧱' },
        { id: 'stars_15', name: '15 ⭐️', displayChance: '0.97%', realChance: 0.97, type: 'stars', value: 15, emoji: '⭐' },
        { id: 'brownie', name: 'Happy Brownie 💩', displayChance: '0.03%', realChance: 0.03, type: 'collectible', emoji: '💩' }
      ],
      elite: [
        { id: 'stars_200', name: '200 ⭐️', displayChance: '75%', realChance: 86, type: 'stars', value: 200, emoji: '⭐' },
        { id: 'stars_275', name: '275 ⭐️', displayChance: '5%', realChance: 1, type: 'stars', value: 275, emoji: '⭐' },
        { id: 'socks', name: 'Носки 🧦', displayChance: '2%', realChance: 0, type: 'collectible', emoji: '🧦' },
        { id: 'lightsword', name: 'Light Sword ⚔️', displayChance: '1%', realChance: 0, type: 'collectible', emoji: '⚔️' },
        { id: 'champagne', name: '🍾', displayChance: '17%', realChance: 13, type: 'collectible', emoji: '🍾' }
      ],
      platinum: [
        { id: 'stars_10', name: '10 ⭐️', displayChance: '75%', realChance: 75, type: 'stars', value: 10, emoji: '⭐' },
        { id: 'stars_50', name: '50 ⭐️', displayChance: '15%', realChance: 15, type: 'stars', value: 50, emoji: '⭐' },
        { id: 'ring', name: '💍', displayChance: '5%', realChance: 5, type: 'collectible', emoji: '💍' },
        { id: 'bday', name: 'B-day 🗓️', displayChance: '4%', realChance: 4.5, type: 'item', sellPrice: 150, emoji: '🗓️' },
        { id: 'bday_pro', name: 'B-Day PRO 📅', displayChance: '1%', realChance: 0.5, type: 'collectible', emoji: '📅' }
      ],
      gold: [
        { id: 'stars_50', name: '50 ⭐️', displayChance: '50%', realChance: 50, type: 'stars', value: 50, emoji: '⭐' },
        { id: 'stars_125', name: '125 ⭐️', displayChance: '35%', realChance: 35, type: 'stars', value: 125, emoji: '⭐' },
        { id: 'clover', name: '🍀 Clover Pin', displayChance: '10%', realChance: 15, type: 'item', sellPrice: 200, emoji: '🍀' },
        { id: 'icecream', name: 'Ice Cream 🍦', displayChance: '3%', realChance: 0, type: 'collectible', emoji: '🍦' },
        { id: 'clover_pro', name: '🍀 Clover Pin PRO', displayChance: '2%', realChance: 0, type: 'collectible', emoji: '🍀' }
      ],
      money: [
        { id: 'stars_75', name: '75 ⭐️', displayChance: '40%', realChance: 40, type: 'stars', value: 75, emoji: '⭐' },
        { id: 'stars_150', name: '150 ⭐️', displayChance: '45%', realChance: 45, type: 'stars', value: 150, emoji: '⭐' },
        { id: 'trophy', name: '🏆', displayChance: '5%', realChance: 5, type: 'collectible', emoji: '🏆' },
        { id: 'gem', name: '💎', displayChance: '5%', realChance: 5, type: 'collectible', emoji: '💎' },
        { id: 'bday_happy', name: 'Happy B-day 💈', displayChance: '4%', realChance: 5, type: 'collectible', emoji: '💈' },
        { id: 'cigar', name: 'Snoop Cigar 🚬', displayChance: '1%', realChance: 0, type: 'collectible', emoji: '🚬' }
      ]
    };

    const INITIAL_CASES = {
      coal: { id: 'coal', name: 'Уголёк', emoji: '🪨', price: 25, color: 'from-gray-600 to-gray-800', locked: false },
      platinum: { id: 'platinum', name: 'Платина', emoji: '💎', price: 100, color: 'from-gray-300 to-gray-500', locked: false },
      gold: { id: 'gold', name: 'Золотой', emoji: '👑', price: 250, color: 'from-yellow-400 to-yellow-600', locked: false },
      money: { id: 'money', name: 'Денежный', emoji: '💵', price: 350, color: 'from-green-400 to-green-600', locked: false },
      elite: { id: 'elite', name: 'Элита', emoji: '🎖️', price: 500, color: 'from-red-400 to-red-600', locked: true, isNew: false },
      diamond: { id: 'diamond', name: 'Алмаз', emoji: '💎', price: 50, originalPrice: 50, discountPrice: 35, color: 'from-blue-400 to-blue-600', locked: true, isNew: false, freeCount: 5 }
    };

    const TON_RATES = [
      { stars: 50, ton: 0.6, id: 'rate_50' },
      { stars: 250, ton: 3, id: 'rate_250' },
      { stars: 500, ton: 6, id: 'rate_500' },
      { stars: 1000, ton: 12, id: 'rate_1000' }
    ];

    function App() {
      const [currentScreen, setCurrentScreen] = useState('cases');
      const [balance, setBalance] = useState(0);
      const [cases, setCases] = useState(INITIAL_CASES);
      const [inventory, setInventory] = useState([]);
      const [inventorySlots, setInventorySlots] = useState(5);
      const [tasks, setTasks] = useState({
        subscribe: { completed: false, progress: 0 },
        deposit: { completed: false, progress: 0 },
        invite: { completed: false, progress: 0, count: 0 }
      });
      const [user, setUser] = useState({ name: 'Пользователь', avatar: null, username: null, id: null });
      const [selectedCase, setSelectedCase] = useState(null);
      const [isSpinning, setIsSpinning] = useState(false);
      const [spinResult, setSpinResult] = useState(null);
      const [showTopUp, setShowTopUp] = useState(false);
      const [promoCode, setPromoCode] = useState('');
      const [promoError, setPromoError] = useState('');
      const [promoSuccess, setPromoSuccess] = useState('');
      const [usedPromos, setUsedPromos] = useState([]);
      const [adminAttempts, setAdminAttempts] = useState(0);
      const [showAdminLogin, setShowAdminLogin] = useState(false);
      const [isAdmin, setIsAdmin] = useState(false);
      const [adminLogin, setAdminLogin] = useState('');
      const [adminPassword, setAdminPassword] = useState('');
      const [adminScreen, setAdminScreen] = useState('stats');
      const [pendingPayments, setPendingPayments] = useState([]);
      const [checkingPayment, setCheckingPayment] = useState(false);
      const [paymentStatus, setPaymentStatus] = useState('');
      const [allUsers, setAllUsers] = useState([]);
      const [selectedUser, setSelectedUser] = useState(null);

      useEffect(() => {
        if (TelegramWebApp) {
          TelegramWebApp.ready();
          TelegramWebApp.expand();
          const tgUser = TelegramWebApp.initDataUnsafe?.user;
          if (tgUser) {
            const newUser = {
              name: tgUser.first_name + (tgUser.last_name ? ' ' + tgUser.last_name : ''),
              username: tgUser.username ? '@' + tgUser.username : null,
              avatar: tgUser.photo_url || null,
              id: tgUser.id.toString()
            };
            setUser(newUser);
            
            // Добавляем пользователя в общий список если его нет
            const savedUsers = JSON.parse(localStorage.getItem('sbs_all_users') || '[]');
            if (!savedUsers.find(u => u.id === tgUser.id.toString())) {
              savedUsers.push({ ...newUser, balance: 0, inventory: [] });
              localStorage.setItem('sbs_all_users', JSON.stringify(savedUsers));
            }
            setAllUsers(savedUsers);
          }
        }
        
        const saved = localStorage.getItem('sbs_game_data');
        if (saved) {
          const data = JSON.parse(saved);
          setBalance(data.balance || 0);
          setCases(data.cases || INITIAL_CASES);
          setInventory(data.inventory || []);
          setTasks(data.tasks || tasks);
          setInventorySlots(data.inventorySlots || 5);
          setPendingPayments(data.pendingPayments || []);
          setUsedPromos(data.usedPromos || []);
        }
      }, []);

      useEffect(() => {
        localStorage.setItem('sbs_game_data', JSON.stringify({
          balance, cases, inventory, tasks, inventorySlots, pendingPayments, usedPromos
        }));
        
        // Обновляем данные пользователя в общем списке
        if (user.id) {
          const savedUsers = JSON.parse(localStorage.getItem('sbs_all_users') || '[]');
          const idx = savedUsers.findIndex(u => u.id === user.id);
          if (idx !== -1) {
            savedUsers[idx] = { ...savedUsers[idx], balance, inventory };
            localStorage.setItem('sbs_all_users', JSON.stringify(savedUsers));
            setAllUsers(savedUsers);
          }
        }
      }, [balance, cases, inventory, tasks, inventorySlots, pendingPayments, usedPromos, user.id]);

      const handleTitleClick = () => {
        const newAttempts = adminAttempts + 1;
        setAdminAttempts(newAttempts);
        if (newAttempts >= 11) {
          setShowAdminLogin(true);
          setAdminAttempts(0);
        }
      };

      const checkAdminLogin = () => {
        if (adminLogin === 'REMOVED' && adminPassword === 'REMOVED') {
          setIsAdmin(true);
          setShowAdminLogin(false);
          setAdminLogin('');
          setAdminPassword('');
          setAllUsers(JSON.parse(localStorage.getItem('sbs_all_users') || '[]'));
        } else {
          alert('Неверный логин или пароль!');
          setAdminLogin('');
          setAdminPassword('');
        }
      };

      const generatePaymentId = () => {
        return 'PAY_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
      };

      const topUpBalance = (stars, ton) => {
        const paymentId = generatePaymentId();
        const memo = `SBS_${user.id}_${stars}_${paymentId}`;
        
        const newPayment = {
          id: paymentId,
          stars: stars,
          ton: ton,
          memo: memo,
          status: 'pending',
          createdAt: Date.now(),
          userId: user.id
        };
        
        setPendingPayments(prev => [...prev, newPayment]);
        
        const tonLink = `ton://transfer/${ADMIN_WALLET}?amount=${Math.round(ton * 1000000000)}&text=${encodeURIComponent(memo)}`;
        window.open(tonLink, '_blank');
        
        setPaymentStatus(`Отправьте ${ton} TON с комментарием: ${memo}`);
        setShowTopUp(false);
        
        setTimeout(() => checkPayment(paymentId), 10000);
      };

      const checkPayment = async (paymentId) => {
        const payment = pendingPayments.find(p => p.id === paymentId);
        if (!payment || payment.status === 'completed') return;

        setCheckingPayment(true);
        setPaymentStatus('Проверяем платеж...');

        try {
          const response = await fetch(`${TONCENTER_API}/getTransactions?address=${ADMIN_WALLET}&limit=20`);
          const data = await response.json();

          if (data.result && Array.isArray(data.result)) {
            const foundTx = data.result.find(tx => {
              const msg = tx.in_msg;
              if (!msg) return false;
              const amount = parseInt(msg.value) / 1000000000;
              const comment = msg.message || '';
              return comment.includes(payment.memo) && Math.abs(amount - payment.ton) < 0.01;
            });

            if (foundTx) {
              setBalance(prev => prev + payment.stars);
              setPendingPayments(prev => prev.map(p => 
                p.id === paymentId ? {...p, status: 'completed', txHash: foundTx.transaction_id.hash} : p
              ));
              setPaymentStatus(`✅ Успешно! Зачислено ${payment.stars} звезд`);
              
              if (!tasks.deposit.completed && payment.stars >= 100) {
                setTasks(prev => ({ ...prev, deposit: { completed: true, progress: 100 } }));
                setCases(prev => ({ ...prev, diamond: { ...prev.diamond, locked: false, isNew: true } }));
              }
              
              setTimeout(() => setPaymentStatus(''), 3000);
            } else {
              setPaymentStatus('Платеж не найден. Попробуйте через минуту...');
            }
          }
        } catch (error) {
          console.error('Error checking payment:', error);
          setPaymentStatus('Ошибка проверки. Попробуйте позже.');
        } finally {
          setCheckingPayment(false);
        }
      };

      const checkAllPendingPayments = async () => {
        for (const payment of pendingPayments.filter(p => p.status === 'pending')) {
          await checkPayment(payment.id);
        }
      };

      const getCasePrice = (caseType) => {
        const c = cases[caseType];
        if (caseType === 'diamond' && c.freeCount > 0) return 0;
        if (caseType === 'diamond' && c.freeCount === 0) return c.discountPrice || c.price;
        return c.price;
      };

      const openCase = (caseType) => {
        const price = getCasePrice(caseType);
        
        if (caseType === 'diamond' && cases.diamond.freeCount > 0) {
          setCases(prev => ({ ...prev, diamond: { ...prev.diamond, freeCount: prev.diamond.freeCount - 1 } }));
          spinRoulette(caseType);
        } else if (balance >= price) {
          setBalance(prev => prev - price);
          spinRoulette(caseType);
        } else {
          alert('Недостаточно звезд! Пополните баланс.');
        }
      };

      const spinRoulette = (caseType) => {
        setIsSpinning(true);
        setSpinResult(null);
        
        const items = CASE_REWARDS[caseType];
        
        setTimeout(() => {
          const rand = Math.random() * 100;
          let cumulative = 0;
          let won = items[0];
          
          for (const item of items) {
            cumulative += item.realChance;
            if (rand <= cumulative) {
              won = item;
              break;
            }
          }

          setSpinResult(won);
          setIsSpinning(false);
          
          if (won.type === 'stars') {
            setBalance(prev => prev + won.value);
          } else {
            addToInventory(won);
          }
        }, 3000);
      };

      const addToInventory = (item) => {
        if (inventory.length < inventorySlots) {
          setInventory(prev => [...prev, { ...item, id: Date.now(), caseType: selectedCase?.id }]);
        } else {
          alert('Инвентарь полон! Продайте предметы или купите слоты.');
        }
      };

      const sellItem = (item) => {
        if (item.type === 'collectible') {
          alert('Это коллекционный предмет! Обратитесь к администрации для выдачи приза.');
          return;
        }
        if (confirm(`Продать ${item.name} за ${item.sellPrice} ⭐️?`)) {
          setBalance(prev => prev + item.sellPrice);
          setInventory(prev => prev.filter(i => i.id !== item.id));
        }
      };

      const unlockSlot = () => {
        if (balance >= 50) {
          if (confirm('Разблокировать слот за 50 ⭐️?')) {
            setBalance(prev => prev - 50);
            setInventorySlots(prev => prev + 1);
          }
        } else {
          alert('Недостаточно звезд!');
        }
      };

      const completeTask = (taskId) => {
        if (taskId === 'subscribe') {
          window.open('https://t.me/stepbystepdelision', '_blank');
          setTimeout(() => {
            setTasks(prev => ({ ...prev, subscribe: { completed: true, progress: 100 } }));
            setCases(prev => ({ ...prev, elite: { ...prev.elite, locked: false, isNew: true } }));
          }, 2000);
        } else if (taskId === 'deposit') {
          setShowTopUp(true);
        } else if (taskId === 'invite') {
          const link = 'https://t.me/share/url?url=' + encodeURIComponent(window.location.href);
          window.open(link, '_blank');
          setTasks(prev => ({
            ...prev,
            invite: { ...prev.invite, count: prev.invite.count + 1 }
          }));
          if (tasks.invite.count >= 2) {
            setTasks(prev => ({ ...prev, invite: { completed: true, progress: 100 } }));
            setBalance(b => b + 5);
          }
        }
      };

      const checkPromo = () => {
        const code = promoCode.toUpperCase();
        if (code === 'DIAMOND') {
          if (usedPromos.includes('DIAMOND')) {
            setPromoError('Вы уже использовали этот промокод!');
            setTimeout(() => setPromoError(''), 3000);
            return;
          }
          
          setUsedPromos(prev => [...prev, 'DIAMOND']);
          setCases(prev => ({
            ...prev,
            diamond: { ...prev.diamond, locked: false, isNew: true, freeCount: (prev.diamond.freeCount || 0) + 2 }
          }));
          setPromoSuccess('Промокод активирован! Получено 2 кейса Алмаз! Откройте раздел "Кейсы"');
          setPromoCode('');
        } else {
          setPromoError('Ошибка! Промокод не найден');
          setTimeout(() => setPromoError(''), 3000);
        }
      };

      const adminGiveReward = (targetUserId, reward) => {
        const savedUsers = JSON.parse(localStorage.getItem('sbs_all_users') || '[]');
        const userIdx = savedUsers.findIndex(u => u.id === targetUserId);
        
        if (userIdx !== -1) {
          if (reward.type === 'stars') {
            savedUsers[userIdx].balance = (savedUsers[userIdx].balance || 0) + reward.amount;
          } else if (reward.type === 'case') {
            // Для кейсов нужна сложная логика, пока просто уведомление
            alert(`Кейс ${reward.caseType} выдан пользователю ${savedUsers[userIdx].name}`);
          } else if (reward.type === 'item') {
            savedUsers[userIdx].inventory = [...(savedUsers[userIdx].inventory || []), reward.item];
          }
          
          localStorage.setItem('sbs_all_users', JSON.stringify(savedUsers));
          setAllUsers(savedUsers);
          
          // Если это текущий пользователь, обновляем его состояние
          if (targetUserId === user.id) {
            setBalance(savedUsers[userIdx].balance);
            setInventory(savedUsers[userIdx].inventory);
          }
          
          alert(`Награда выдана пользователю ${savedUsers[userIdx].name}!`);
        }
      };

      const handleCollectibleClick = (item) => {
        if (item.type === 'collectible') {
          window.open('https://t.me/stepbystepdelision', '_blank');
        }
      };

      if (isAdmin) {
        return (
          <div className="min-h-screen bg-gray-900 p-4">
            <div className="max-w-4xl mx-auto">
              <div className="flex justify-between items-center mb-6">
                <h1 className="text-2xl font-bold text-white">🔐 Админ-панель</h1>
                <button onClick={() => setIsAdmin(false)} className="text-gray-400 hover:text-white">Выйти</button>
              </div>
              
              <div className="flex gap-2 mb-6 overflow-x-auto">
                {['stats', 'users', 'cases', 'tasks', 'payments', 'rewards', 'settings'].map(tab => (
                  <button
                    key={tab}
                    onClick={() => setAdminScreen(tab)}
                    className={`px-4 py-2 rounded-lg capitalize ${adminScreen === tab ? 'bg-indigo-600' : 'bg-gray-700'}`}
                  >
                    {tab === 'stats' && '📊'}
                    {tab === 'users' && '👥'}
                    {tab === 'cases' && '🎁'}
                    {tab === 'tasks' && '📝'}
                    {tab === 'payments' && '💳'}
                    {tab === 'rewards' && '🎀'}
                    {tab === 'settings' && '⚙️'} {tab}
                  </button>
                ))}
              </div>

              <div className="glass rounded-xl p-6">
                {adminScreen === 'stats' && (
                  <div className="grid grid-cols-2 gap-4">
                    <div className="bg-gray-800 p-4 rounded-lg">
                      <div className="text-gray-400">Всего игроков</div>
                      <div className="text-3xl font-bold">{allUsers.length}</div>
                    </div>
                    <div className="bg-gray-800 p-4 rounded-lg">
                      <div className="text-gray-400">Общий баланс</div>
                      <div className="text-3xl font-bold">{allUsers.reduce((sum, u) => sum + (u.balance || 0), 0).toFixed(2)} ⭐</div>
                    </div>
                    <div className="bg-gray-800 p-4 rounded-lg">
                      <div className="text-gray-400">Онлайн</div>
                      <div className="text-3xl font-bold">{allUsers.length}</div>
                    </div>
                    <div className="bg-gray-800 p-4 rounded-lg">
                      <div className="text-gray-400">Всего подарков</div>
                      <div className="text-3xl font-bold">{allUsers.reduce((sum, u) => sum + (u.inventory?.length || 0), 0)}</div>
                    </div>
                  </div>
                )}
                
                {adminScreen === 'users' && (
                  <div>
                    <h3 className="text-lg mb-4">Список игроков</h3>
                    <div className="space-y-2 max-h-96 overflow-y-auto">
                      {allUsers.map(u => (
                        <div key={u.id} className="bg-gray-800 p-3 rounded-lg flex justify-between items-center">
                          <div>
                            <div className="font-bold">{u.name}</div>
                            <div className="text-sm text-gray-400">{u.username || 'Нет username'}</div>
                          </div>
                          <div className="text-right">
                            <div>{(u.balance || 0).toFixed(2)} ⭐</div>
                            <div className="text-sm text-gray-400">{u.inventory?.length || 0} предметов</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {adminScreen === 'rewards' && (
                  <div>
                    <h3 className="text-lg mb-4">Выдача наград</h3>
                    <div className="space-y-4">
                      <div>
                        <label className="block text-sm mb-2">Выберите игрока:</label>
                        <select 
                          className="w-full bg-gray-800 border border-gray-600 rounded-lg p-2"
                          onChange={(e) => setSelectedUser(e.target.value)}
                          value={selectedUser || ''}
                        >
                          <option value="">Выберите...</option>
                          {allUsers.map(u => (
                            <option key={u.id} value={u.id}>{u.name} ({u.username || u.id})</option>
                          ))}
                        </select>
                      </div>
                      
                      {selectedUser && (
                        <div className="grid grid-cols-2 gap-2">
                          <button 
                            onClick={() => adminGiveReward(selectedUser, { type: 'stars', amount: 100 })}
                            className="bg-green-600 p-3 rounded-lg"
                          >
                            +100 ⭐
                          </button>
                          <button 
                            onClick={() => adminGiveReward(selectedUser, { type: 'stars', amount: 500 })}
                            className="bg-green-600 p-3 rounded-lg"
                          >
                            +500 ⭐
                          </button>
                          <button 
                            onClick={() => adminGiveReward(selectedUser, { type: 'stars', amount: 1000 })}
                            className="bg-green-600 p-3 rounded-lg"
                          >
                            +1000 ⭐
                          </button>
                          <button 
                            onClick={() => adminGiveReward(selectedUser, { type: 'item', item: { id: Date.now(), name: 'Мишка 🧸', emoji: '🧸', type: 'item', sellPrice: 30 } })}
                            className="bg-blue-600 p-3 rounded-lg"
                          >
                            🧸 Мишка
                          </button>
                          <button 
                            onClick={() => adminGiveReward(selectedUser, { type: 'item', item: { id: Date.now(), name: 'Снуп Дог 🐕', emoji: '🐕', type: 'item', sellPrice: 125 } })}
                            className="bg-blue-600 p-3 rounded-lg"
                          >
                            🐕 Снуп Дог
                          </button>
                          <button 
                            onClick={() => adminGiveReward(selectedUser, { type: 'item', item: { id: Date.now(), name: 'Алмаз 💎', emoji: '💎', type: 'collectible' } })}
                            className="bg-purple-600 p-3 rounded-lg"
                          >
                            💎 Алмаз (коллекц.)
                          </button>
                          <button 
                            onClick={() => adminGiveReward(selectedUser, { type: 'item', item: { id: Date.now(), name: 'Happy Brownie 💩', emoji: '💩', type: 'collectible' } })}
                            className="bg-yellow-600 p-3 rounded-lg"
                          >
                            💩 Brownie
                          </button>
                          <button 
                            onClick={() => adminGiveReward(selectedUser, { type: 'item', item: { id: Date.now(), name: 'Light Sword ⚔️', emoji: '⚔️', type: 'collectible' } })}
                            className="bg-red-600 p-3 rounded-lg"
                          >
                            ⚔️ Light Sword
                          </button>
                        </div>
                      )}
                      
                      <div className="border-t border-gray-700 pt-4 mt-4">
                        <h4 className="font-bold mb-2">Выдать себе:</h4>
                        <div className="grid grid-cols-3 gap-2">
                          <button onClick={() => setBalance(b => b + 10000)} className="bg-indigo-600 p-2 rounded">+10000 ⭐</button>
                          <button onClick={() => addToInventory({ id: Date.now(), name: 'Алмаз 💎', emoji: '💎', type: 'collectible' })} className="bg-purple-600 p-2 rounded">💎 Алмаз</button>
                          <button onClick={() => addToInventory({ id: Date.now(), name: '🏆', emoji: '🏆', type: 'collectible' })} className="bg-yellow-600 p-2 rounded">🏆 Трофей</button>
                          <button onClick={() => addToInventory({ id: Date.now(), name: '💍', emoji: '💍', type: 'collectible' })} className="bg-pink-600 p-2 rounded">💍 Кольцо</button>
                          <button onClick={() => addToInventory({ id: Date.now(), name: '🍾', emoji: '🍾', type: 'collectible' })} className="bg-green-600 p-2 rounded">🍾 Шампанское</button>
                          <button onClick={() => addToInventory({ id: Date.now(), name: '⚔️', emoji: '⚔️', type: 'collectible' })} className="bg-red-600 p-2 rounded">⚔️ Меч</button>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {adminScreen === 'cases' && (
                  <div>
                    <h3 className="text-lg mb-4">Управление кейсами</h3>
                    {Object.values(cases).map(c => (
                      <div key={c.id} className="bg-gray-800 p-3 rounded-lg mb-2 flex justify-between items-center">
                        <span>{c.emoji} {c.name}</span>
                        <div className="text-right">
                          <div>{c.price} ⭐</div>
                          {c.id === 'diamond' && <div className="text-sm text-green-400">Бесплатных: {c.freeCount}</div>}
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {adminScreen === 'tasks' && (
                  <div>
                    <h3 className="text-lg mb-4">Статус заданий</h3>
                    {Object.entries(tasks).map(([key, task]) => (
                      <div key={key} className="bg-gray-800 p-3 rounded-lg mb-2">
                        <div className="flex justify-between">
                          <span className="capitalize">{key}</span>
                          <span className={task.completed ? 'text-green-400' : 'text-yellow-400'}>
                            {task.completed ? '✅ Выполнено' : '⏳ В процессе'}
                          </span>
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {adminScreen === 'payments' && (
                  <div>
                    <h3 className="text-lg mb-4">История платежей</h3>
                    {pendingPayments.length === 0 ? (
                      <p className="text-gray-400">Нет платежей</p>
                    ) : (
                      pendingPayments.map(p => (
                        <div key={p.id} className={`p-3 rounded-lg mb-2 ${p.status === 'completed' ? 'bg-green-800' : 'bg-yellow-800'}`}>
                          <div className="flex justify-between">
                            <span>{p.stars} ⭐ ({p.ton} TON)</span>
                            <span>{p.status === 'completed' ? '✅' : '⏳'}</span>
                          </div>
                          <div className="text-xs text-gray-400 truncate">{p.memo}</div>
                        </div>
                      ))
                    )}
                  </div>
                )}

                {adminScreen === 'settings' && (
                  <div>
                    <h3 className="text-lg mb-4">Настройки</h3>
                    <div className="mb-4">
                      <p className="text-sm text-gray-400 mb-2">TON Кошелек:</p>
                      <p className="text-xs break-all bg-gray-800 p-2 rounded">{ADMIN_WALLET}</p>
                    </div>
                    <button 
                      onClick={() => {localStorage.clear(); window.location.reload();}}
                      className="bg-red-600 px-4 py-2 rounded-lg"
                    >
                      🗑️ Сбросить все данные
                    </button>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen pb-24">
          <header className="p-4 flex justify-between items-center glass sticky top-0 z-50">
            <h1 
              onClick={handleTitleClick}
              className="text-xl font-bold cursor-pointer select-none"
            >
              Step By Step Game
            </h1>
            <button 
              onClick={() => alert('Пополните баланс 🎯')}
              className="bg-gradient-to-r from-yellow-400 to-orange-500 px-4 py-2 rounded-full font-bold text-gray-900 shadow-lg"
            >
              {balance.toFixed(2)} ⭐
            </button>
          </header>

          {paymentStatus && (
            <div className={`mx-4 mt-2 p-3 rounded-lg text-center text-sm ${paymentStatus.includes('✅') ? 'bg-green-500/20 border border-green-500' : 'bg-blue-500/20 border border-blue-500'}`}>
              {checkingPayment && <span className="loading-dots">Проверка</span>}
              {paymentStatus}
              {pendingPayments.filter(p => p.status === 'pending').length > 0 && !checkingPayment && (
                <button 
                  onClick={checkAllPendingPayments}
                  className="ml-2 underline text-yellow-300"
                >
                  Проверить сейчас
                </button>
              )}
            </div>
          )}

          {showAdminLogin && (
            <div className="fixed inset-0 bg-black/90 z-[60] flex items-center justify-center p-4">
              <div className="glass rounded-2xl p-6 max-w-sm w-full">
                <h2 className="text-xl font-bold text-center mb-4">🔐 Вход в админ-панель</h2>
                <input 
                  type="text" 
                  placeholder="Логин"
                  value={adminLogin}
                  onChange={(e) => setAdminLogin(e.target.value)}
                  className="w-full bg-gray-800 border border-gray-600 rounded-lg px-4 py-3 mb-3 text-center"
                />
                <input 
                  type="password" 
                  placeholder="Пароль"
                  value={adminPassword}
                  onChange={(e) => setAdminPassword(e.target.value)}
                  className="w-full bg-gray-800 border border-gray-600 rounded-lg px-4 py-3 mb-4 text-center"
                />
                <button 
                  onClick={checkAdminLogin}
                  className="w-full bg-indigo-600 py-3 rounded-xl font-bold mb-2"
                >
                  Войти
                </button>
                <button 
                  onClick={() => setShowAdminLogin(false)}
                  className="w-full bg-gray-700 py-2 rounded-xl"
                >
                  Отмена
                </button>
              </div>
            </div>
          )}

          <main className="p-4 max-w-md mx-auto">
            {currentScreen === 'cases' && (
              <div>
                <h2 className="text-2xl font-bold mb-4 text-center">🎰 Кейсы</h2>
                {cases.diamond.freeCount > 0 && (
                  <div className="bg-green-500/20 border border-green-500 rounded-lg p-3 mb-4 text-center">
                    🎁 Бесплатных кейсов Алмаз: {cases.diamond.freeCount}
                  </div>
                )}
                <div className="grid grid-cols-2 gap-4">
                  {Object.values(cases).map(c => (
                    <div key={c.id} className={`glass rounded-xl p-4 relative ${c.locked ? 'opacity-75' : ''}`}>
                      {c.isNew && (
                        <span className="absolute -top-2 -right-2 bg-red-500 text-xs px-2 py-1 rounded-full animate-pulse">
                          Новое!
                        </span>
                      )}
                      {c.id === 'diamond' && c.freeCount === 0 && !c.locked && (
                        <span className="absolute -top-2 -left-2 bg-green-500 text-xs px-2 py-1 rounded-full animate-pulse">
                          Скидка!
                        </span>
                      )}
                      <div className={`w-16 h-16 mx-auto rounded-lg bg-gradient-to-br ${c.color} flex items-center justify-center text-3xl mb-2`}>
                        {c.emoji}
                      </div>
                      <h3 className="font-bold text-center">{c.name}</h3>
                      <p className="text-center text-sm opacity-75">
                        {c.id === 'diamond' && c.freeCount > 0 ? (
                          <span className="text-green-400">Бесплатно!</span>
                        ) : c.id === 'diamond' && c.freeCount === 0 ? (
                          <span>
                            <span className="line-through">{c.originalPrice}</span> {c.discountPrice} ⭐
                          </span>
                        ) : (
                          `${c.price} ⭐`
                        )}
                      </p>
                      <button 
                        onClick={() => c.locked ? alert('Кейс заблокирован! Выполните задания или используйте промокод.') : setSelectedCase(c)}
                        className={`w-full mt-2 py-2 rounded-lg font-bold ${c.locked ? 'bg-gray-600' : 'bg-gradient-to-r from-indigo-500 to-purple-500'}`}
                      >
                        {c.locked ? '🔒' : 'Открыть'}
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {currentScreen === 'tasks' && (
              <div>
                <h2 className="text-2xl font-bold mb-4 text-center">📋 Мои Задания</h2>
                <div className="space-y-4">
                  <div className={`glass rounded-xl p-4 ${tasks.subscribe.completed ? 'bg-green-500/20 border-green-500' : ''}`}>
                    <div className="flex justify-between items-start mb-2">
                      <div>
                        <h3 className="font-bold">Подпишись на канал</h3>
                        <p className="text-sm opacity-75">Награда: x1 кейс «Элита»</p>
                      </div>
                      {tasks.subscribe.completed && <span className="text-green-400 text-2xl">✅</span>}
                    </div>
                    <button 
                      onClick={() => completeTask('subscribe')}
                      disabled={tasks.subscribe.completed}
                      className={`w-full py-2 rounded-lg ${tasks.subscribe.completed ? 'bg-green-600' : 'bg-blue-600'}`}
                    >
                      {tasks.subscribe.completed ? 'Выполнено' : 'Подписаться'}
                    </button>
                  </div>

                  <div className={`glass rounded-xl p-4 ${tasks.deposit.completed ? 'bg-green-500/20 border-green-500' : ''}`}>
                    <div className="flex justify-between items-start mb-2">
                      <div>
                        <h3 className="font-bold">Пополнить баланс на 100 ⭐</h3>
                        <p className="text-sm opacity-75">Награда: кейс «Алмаз»</p>
                      </div>
                      {tasks.deposit.completed && <span className="text-green-400 text-2xl">✅</span>}
                    </div>
                    <button 
                      onClick={() => completeTask('deposit')}
                      className={`w-full py-2 rounded-lg ${tasks.deposit.completed ? 'bg-green-600' : 'bg-blue-600'}`}
                    >
                      {tasks.deposit.completed ? 'Выполнено' : 'Пополнить'}
                    </button>
                  </div>

                  <div className={`glass rounded-xl p-4 ${tasks.invite.completed ? 'bg-green-500/20 border-green-500' : ''}`}>
                    <div className="flex justify-between items-start mb-2">
                      <div>
                        <h3 className="font-bold">Пригласить трёх друзей</h3>
                        <p className="text-sm opacity-75">Прогресс: {tasks.invite.count}/3 | Награда: 5 ⭐</p>
                      </div>
                      {tasks.invite.completed && <span className="text-green-400 text-2xl">✅</span>}
                    </div>
                    <div className="w-full bg-gray-700 rounded-full h-2 mb-3">
                      <div 
                        className="bg-blue-500 h-2 rounded-full transition-all"
                        style={{width: `${(tasks.invite.count / 3) * 100}%`}}
                      />
                    </div>
                    <button 
                      onClick={() => completeTask('invite')}
                      disabled={tasks.invite.completed}
                      className={`w-full py-2 rounded-lg ${tasks.invite.completed ? 'bg-green-600' : 'bg-blue-600'}`}
                    >
                      {tasks.invite.completed ? 'Выполнено' : 'Пригласить'}
                    </button>
                  </div>
                </div>
              </div>
            )}

            {currentScreen === 'profile' && (
              <div>
                <h2 className="text-2xl font-bold mb-4 text-center">👤 Мой Профиль</h2>
                <div className="glass rounded-xl p-6 text-center mb-4">
                  <div className="w-24 h-24 mx-auto rounded-full bg-gradient-to-br from-indigo-400 to-purple-500 flex items-center justify-center text-4xl mb-3 overflow-hidden">
                    {user.avatar ? (
                      <img src={user.avatar} alt="avatar" className="w-full h-full object-cover" />
                    ) : (
                      user.name.charAt(0).toUpperCase()
                    )}
                  </div>
                  <h3 className="text-xl font-bold">{user.name}</h3>
                  {user.username && <p className="text-gray-400">{user.username}</p>}
                </div>

                <button 
                  onClick={() => setShowTopUp(true)}
                  className="w-full bg-gradient-to-r from-yellow-400 to-orange-500 text-gray-900 font-bold py-3 rounded-xl mb-4 shadow-lg"
                >
                  Пополнить баланс ⭐
                </button>

                <div className="glass rounded-xl p-4 mb-4">
                  <h3 className="font-bold mb-2">🎁 Промокод</h3>
                  <div className="flex gap-2">
                    <input 
                      type="text"
                      placeholder="ВВЕДИТЕ ПРОМОКОД"
                      value={promoCode}
                      onChange={(e) => setPromoCode(e.target.value)}
                      className="flex-1 bg-gray-700/50 border border-gray-600 rounded-lg px-3 py-2 text-center uppercase"
                    />
                    <button 
                      onClick={checkPromo}
                      className="bg-indigo-600 px-4 py-2 rounded-lg font-bold"
                    >
                      OK
                    </button>
                  </div>
                  {promoError && <p className="text-red-400 text-sm mt-2 text-center">{promoError}</p>}
                  {promoSuccess && <p className="text-green-400 text-sm mt-2 text-center">{promoSuccess}</p>}
                </div>

                <div className="glass rounded-xl p-4">
                  <h3 className="font-bold mb-3">🎒 Инвентарь ({inventory.length}/{inventorySlots})</h3>
                  <div className="grid grid-cols-5 gap-2 mb-4">
                    {[...Array(inventorySlots)].map((_, i) => (
                      <div key={i} className="aspect-square bg-gray-700/50 rounded-lg flex items-center justify-center text-2xl relative">
                        {inventory[i] ? (
                          <span 
                            onClick={() => inventory[i].type === 'collectible' ? handleCollectibleClick(inventory[i]) : sellItem(inventory[i])} 
                            className={`cursor-pointer ${inventory[i].type === 'collectible' ? 'animate-pulse' : ''}`}
                            title={inventory[i].type === 'collectible' ? 'Коллекционный предмет - нажмите для связи с админом' : 'Нажмите чтобы продать'}
                          >
                            {inventory[i].emoji}
                          </span>
                        ) : (
                          <span className="text-gray-600 text-xs">Пусто</span>
                        )}
                      </div>
                    ))}
                    {[...Array(5)].map((_, i) => (
                      <button 
                        key={`lock-${i}`}
                        onClick={unlockSlot}
                        className="aspect-square bg-gray-800 rounded-lg flex items-center justify-center text-xl border-2 border-dashed border-gray-600"
                      >
                        🔒
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </main>

          {selectedCase && (
            <div className="fullscreen-modal flex items-center justify-center p-4">
              <div className="w-full max-w-lg">
                <div className="flex justify-between items-center mb-6">
                  <h3 className="text-3xl font-bold">{selectedCase.emoji} {selectedCase.name}</h3>
                  <button onClick={() => {setSelectedCase(null); setSpinResult(null);}} className="text-3xl">&times;</button>
                </div>
                
                <div className="relative mb-8">
                  <div className="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-3 z-10">
                    <div className="w-0 h-0 border-l-[15px] border-l-transparent border-r-[15px] border-r-transparent border-t-[20px] border-t-red-500"></div>
                  </div>
                  <div className="absolute bottom-0 left-1/2 -translate-x-1/2 translate-y-3 z-10">
                    <div className="w-0 h-0 border-l-[15px] border-l-transparent border-r-[15px] border-r-transparent border-b-[20px] border-b-red-500"></div>
                  </div>
                  
                  <div className="roulette-container bg-gray-800 rounded-xl h-48 overflow-hidden relative border-2 border-white/20">
                    <div className={`flex items-center h-full ${isSpinning ? 'animate-pulse' : ''}`}>
                      {isSpinning ? (
                        <div className="flex gap-6 px-6 animate-[spin-slow_0.3s_linear_infinite]">
                          {[...Array(30)].map((_, i) => (
                            <div key={i} className="w-32 h-32 flex-shrink-0 bg-gradient-to-br from-gray-700 to-gray-600 rounded-xl flex items-center justify-center text-5xl shadow-lg">
                              {CASE_REWARDS[selectedCase.id][i % CASE_REWARDS[selectedCase.id].length].emoji}
                            </div>
                          ))}
                        </div>
                      ) : spinResult ? (
                        <div className="w-full flex justify-center">
                          <div className="w-32 h-32 bg-gradient-to-br from-indigo-500 to-purple-500 rounded-xl flex items-center justify-center text-6xl animate-bounce shadow-2xl">
                            {spinResult.emoji}
                          </div>
                        </div>
                      ) : (
                        <div className="w-full text-center text-gray-400 text-xl">Нажмите кнопку для открытия</div>
                      )}
                    </div>
                  </div>
                </div>

                <div className="glass rounded-xl p-4 mb-6">
                  <p className="font-bold mb-2 text-center text-lg">Возможные награды:</p>
                  <div className="grid grid-cols-1 gap-1 text-sm">
                    {CASE_REWARDS[selectedCase.id].map((reward, idx) => (
                      <div key={idx} className="flex justify-between py-1 border-b border-white/10 last:border-0">
                        <span>{reward.emoji} {reward.name}</span>
                        <span className="text-yellow-400">{reward.displayChance}</span>
                      </div>
                    ))}
                  </div>
                </div>

                {spinResult ? (
                  <div className="text-center">
                    <p className="text-2xl font-bold mb-4">Выпало: {spinResult.name}!</p>
                    {spinResult.type === 'collectible' && (
                      <p className="text-sm text-yellow-400 mb-4">⭐ Коллекционный предмет! Обратитесь к администрации.</p>
                    )}
                    <button 
                      onClick={() => {setSelectedCase(null); setSpinResult(null);}}
                      className="w-full bg-green-600 py-4 rounded-xl font-bold text-xl"
                    >
                      Забрать
                    </button>
                  </div>
                ) : (
                  <button 
                    onClick={() => openCase(selectedCase.id)}
                    disabled={isSpinning}
                    className="w-full bg-gradient-to-r from-indigo-500 to-purple-500 py-4 rounded-xl font-bold text-xl disabled:opacity-50"
                  >
                    {isSpinning ? 'Крутим...' : `Открыть за ${getCasePrice(selectedCase.id) === 0 ? 'Бесплатно' : getCasePrice(selectedCase.id) + ' ⭐'}`}
                  </button>
                )}
              </div>
            </div>
          )}

          {showTopUp && (
            <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
              <div className="glass rounded-2xl p-6 max-w-sm w-full">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-xl font-bold">💳 Пополнение TON</h3>
                  <button onClick={() => setShowTopUp(false)} className="text-2xl">&times;</button>
                </div>
                
                <div className="bg-blue-500/20 border border-blue-500 rounded-lg p-3 mb-4 text-sm">
                  <p>После оплаты нажмите "Проверить" на главном экране</p>
                </div>

                <div className="space-y-3">
                  {TON_RATES.map((rate) => (
                    <button
                      key={rate.stars}
                      onClick={() => topUpBalance(rate.stars, rate.ton)}
                      className="w-full glass p-4 rounded-xl flex justify-between items-center hover:bg-white/10"
                    >
                      <span className="font-bold">+{rate.stars} звезд ⭐</span>
                      <span className="text-yellow-400">{rate.ton} TON</span>
                    </button>
                  ))}
                </div>
                
                <div className="mt-4 text-xs text-center opacity-50">
                  <p>Адрес: {ADMIN_WALLET.slice(0, 10)}...{ADMIN_WALLET.slice(-6)}</p>
                </div>
              </div>
            </div>
          )}

          <nav className="fixed bottom-0 left-0 right-0 glass border-t border-white/10 p-2">
            <div className="max-w-md mx-auto flex justify-around">
              <button 
                onClick={() => setCurrentScreen('tasks')}
                className={`flex flex-col items-center p-2 rounded-lg ${currentScreen === 'tasks' ? 'text-blue-400' : 'text-gray-400'}`}
              >
                <span className="text-2xl">📋</span>
                <span className="text-xs">Задания</span>
              </button>
              <button 
                onClick={() => setCurrentScreen('cases')}
                className={`flex flex-col items-center p-2 rounded-lg ${currentScreen === 'cases' ? 'text-blue-400' : 'text-gray-400'}`}
              >
                <span className="text-2xl">🎁</span>
                <span className="text-xs">Кейсы</span>
              </button>
              <button 
                onClick={() => setCurrentScreen('profile')}
                className={`flex flex-col items-center p-2 rounded-lg ${currentScreen === 'profile' ? 'text-blue-400' : 'text-gray-400'}`}
              >
                <span className="text-2xl">👤</span>
                <span className="text-xs">Профиль</span>
              </button>
            </div>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
